name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate Vim syntax
    runs-on: ubuntu-latest
    # Bounded on purpose. On 2026-08-19 `apt-get update` stalled on
    # archive.ubuntu.com and this job ran for the full six-hour default before
    # being cancelled, which left a green PR looking dead for two days. A stalled
    # mirror should cost minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Vim and Neovim
        run: |
          sudo apt-get update
          sudo apt-get install -y vim neovim

      - name: Source syntax/carve.vim (must load without error)
        run: |
          vim -u NONE -N -es \
            -c 'syntax on' \
            -c 'source syntax/carve.vim' \
            -c 'q'

      - name: Source all Vim runtime files
        run: |
          for f in ftdetect/carve.vim ftplugin/carve.vim indent/carve.vim; do
            echo "Sourcing $f"
            vim -u NONE -N -es -c "source $f" -c 'q'
          done

      # Loading is not behaviour. Two rules stayed wrong through several
      # releases because nothing here asserted what the syntax highlights:
      # `>no space` coloured as a blockquote and `- ` as a list, where carve-rs
      # renders both as paragraphs.
      - name: Assert what the syntax highlights
        run: ./tests/run-highlight-tests.sh

      # The same table every other Carve grammar is checked against. Six copies
      # of these block rules exist; the last drift was found by comparing them
      # by hand, which is not a control.
      - name: The shared block battery agrees
        run: ./tests/run-block-battery.sh

      # The Lua half of this plugin had no check at all: lua/carve/init.lua and
      # lua/carve/lsp.lua could fail to parse and every step above would still
      # pass, because Vim never sources *.lua.
      - name: The Lua modules load
        run: |
          nvim --headless --clean --cmd "set runtimepath^=$PWD" \
            -c 'lua require("carve"); require("carve.lsp")' -c 'q'

      - name: The language server wiring does what it claims
        run: ./tests/run-lsp-tests.sh

      - name: Check tree-sitter query files are present
        run: |
          for q in highlights indents injections locals folds context textobjects; do
            test -s "queries/carve/$q.scm" || { echo "Missing or empty queries/carve/$q.scm"; exit 1; }
          done
          echo "All tree-sitter query files present."

      # Loading is not the same as HIGHLIGHTING. Every step above this one is
      # satisfied by a syntax file that defines nothing: sourcing it succeeds,
      # the query files are present, and the drift checks compare copies of
      # OTHER projects' files. A rule deleted from syntax/carve.vim broke none of
      # them.
      #
      # tests/highlight.crv carries the assertions in the document itself, in
      # Sublime's shape - a `%%` line whose carets mark columns of the line above
      # and name the group each must carry. `%%` is a Carve comment, so the file
      # stays a valid Carve document, and an assertion cannot drift away from the
      # source it describes.
      - name: The syntax file actually highlights
        run: |
          vim -Nu NONE --cmd "set rtp^=$PWD" -es -S tests/run-highlight.vim tests/highlight.crv

      # Present is not the same as correct. These files are copies of
      # tree-sitter-carve's (see README) and nothing compared them, so they
      # drifted: the heading level predicates were off by one and two rule
      # groups were missing entirely.
      - name: Bundled queries still match tree-sitter-carve
        run: ./tools/check-query-drift.sh

      # Separate from the tests above on purpose: this reaches the network, so a
      # failure means the vendored battery is stale (or GitHub is down), not
      # that the syntax is wrong.
      - name: The vendored block battery still matches carve-grammars
        run: ./tools/check-battery-drift.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate Vim syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install -y vim

      - name: Source syntax/carve.vim (must load without error)
        run: |
          vim -u NONE -N -es \
            -c 'syntax on' \
            -c 'source syntax/carve.vim' \
            -c 'q'

      - name: Source all Vim runtime files
        run: |
          for f in ftdetect/carve.vim ftplugin/carve.vim indent/carve.vim; do
            echo "Sourcing $f"
            vim -u NONE -N -es -c "source $f" -c 'q'
          done

      # Loading is not behaviour. Two rules stayed wrong through several
      # releases because nothing here asserted what the syntax highlights:
      # `>no space` coloured as a blockquote and `- ` as a list, where carve-rs
      # renders both as paragraphs.
      - name: Assert what the syntax highlights
        run: ./tests/run-highlight-tests.sh

      # The same table every other Carve grammar is checked against. Six copies
      # of these block rules exist; the last drift was found by comparing them
      # by hand, which is not a control.
      - name: The shared block battery agrees
        run: ./tests/run-block-battery.sh

      - name: Check tree-sitter query files are present
        run: |
          for q in highlights indents injections locals folds context textobjects; do
            test -s "queries/carve/$q.scm" || { echo "Missing or empty queries/carve/$q.scm"; exit 1; }
          done
          echo "All tree-sitter query files present."

      # Present is not the same as correct. These files are copies of
      # tree-sitter-carve's (see README) and nothing compared them, so they
      # drifted: the heading level predicates were off by one and two rule
      # groups were missing entirely.
      - name: Bundled queries still match tree-sitter-carve
        run: ./tools/check-query-drift.sh

      # Separate from the tests above on purpose: this reaches the network, so a
      # failure means the vendored battery is stale (or GitHub is down), not
      # that the syntax is wrong.
      - name: The vendored block battery still matches carve-grammars
        run: ./tools/check-battery-drift.sh
